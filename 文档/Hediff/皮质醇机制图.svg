<text x="508.0" y="177.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">② 降低皮质醇的事件  ↓</text>
<text x="512.0" y="220.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 娱乐活动</text>
<text x="705.0" y="220.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 优质睡眠</text>
<text x="512.0" y="250.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 高心情</text>
<text x="705.0" y="250.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 美食</text>
<text x="512.0" y="280.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 自然衰减</text>
<text x="512.0" y="514.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11" fill="#7F8C8D" text-anchor="start">（恢复来源，叠加降低浓度）</text>
<rect x="320.0" y="560.0" width="300.0" height="54.0" rx="27" ry="27" fill="#14507A"/>
<text x="470.0" y="594.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">皮质醇浓度过高</text>
