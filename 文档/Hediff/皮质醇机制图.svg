<rect x="0.0" y="0.0" width="940.0" height="110.0" rx="0" ry="0" fill="url(#hdr)"/>
<text x="40.0" y="52.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="28" fill="#FFFFFF" text-anchor="start" font-weight="bold">皮质醇 Cortisol 影响机制（简明版）</text>
<text x="40.0" y="84.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#DCEEFB" text-anchor="start">哪些事件抬升 / 降低皮质醇  ·  高皮质醇触发哪些坏 Hediff</text>
<rect x="40.0" y="150.0" width="410.0" height="380.0" rx="12" ry="12" fill="#FFFFFF" stroke="#D5DEE8" stroke-width="1"/>
<rect x="40.0" y="150.0" width="410.0" height="40.0" rx="12" ry="12" fill="#E74C3C"/>
<rect x="40.0" y="180.0" width="410.0" height="10.0" rx="0" ry="0" fill="#E74C3C"/>
<text x="58.0" y="177.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">① 抬升皮质醇的事件  ↑</text>
<text x="62.0" y="220.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 低心情</text>
<text x="255.0" y="220.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 饥饿</text>
<text x="62.0" y="250.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 疼痛</text>
<text x="255.0" y="250.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 得病</text>
<text x="62.0" y="280.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 被侮辱</text>
<text x="255.0" y="280.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 不舒适</text>
<text x="62.0" y="310.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 缺少娱乐</text>
<text x="255.0" y="310.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 环境差</text>
<text x="62.0" y="340.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 吃生食</text>
<text x="255.0" y="340.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">• 湿透</text>
<text x="62.0" y="514.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11" fill="#7F8C8D" text-anchor="start">（应激源，满足条件即叠加抬升）</text>
<rect x="490.0" y="150.0" width="410.0" height="380.0" rx="12" ry="12" fill="#FFFFFF" stroke="#D5DEE8" stroke-width="1"/>
