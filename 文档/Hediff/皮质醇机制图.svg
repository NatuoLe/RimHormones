<text x="40.0" y="630.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="15" fill="#2C3E50" text-anchor="start" font-weight="bold">③ 高皮质醇触发的坏 Hediff（每 6000 tick 检测，加权随机抽其一）</text>
