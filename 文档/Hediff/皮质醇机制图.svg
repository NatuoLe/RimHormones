<text x="586.0" y="671.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="9" fill="#FFFFFF" text-anchor="end">CortisolAnhedonia</text>
<text x="358.0" y="716.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">正面心情归零</text>
<text x="358.0" y="742.0" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" fill="#2C3E50" text-anchor="start">负面心情保留</text>
